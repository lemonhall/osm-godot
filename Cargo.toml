[package]
name = "osm-godot"
version = "0.1.0"
edition = "2021"
description = "Generate Godot Engine 3D scenes from real-world OpenStreetMap + elevation data"
repository = "https://github.com/lemon/osm-godot"
license = "Apache-2.0"

[profile.release]
lto = "thin"
overflow-checks = true

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
colored = "3"
geo = "0.33"
image = "0.25"
log = "0.4"
once_cell = "1.21"
rand = { version = "0.9", features = ["std", "std_rng"] }
rayon = "1.10"
reqwest = { version = "0.13", features = ["blocking", "json", "query"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.1"
fnv = "1.0"
parquet = { version = "58", default-features = false, features = ["snap", "zstd"] }
tiff = "0.11"
byteorder = "1.5"
bytes = "1"
